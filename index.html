<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>С Днём Рождения, Жасмин 🌸</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #050510;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .stage {
    position: relative;
    width: min(96vw, 100vh * 1.6);
    aspect-ratio: 320 / 200;
    max-height: 96vh;
  }
  canvas {
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
    box-shadow: 0 0 60px rgba(20, 20, 50, 0.6),
                0 0 120px rgba(0, 0, 0, 0.6);
    border-radius: 4px;
    cursor: pointer;
    background: #050510;
  }
  .msg {
    position: absolute;
    left: 8%; right: 8%;
    top: 22%;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 2s ease-in;
    line-height: 1.3;
  }
  .msg.show { opacity: 1; }
  .line1 {
    font-family: 'Courier New', 'Lucida Console', monospace;
    font-size: clamp(18px, 4.2vw, 40px);
    font-weight: 900;
    letter-spacing: 0.5px;
    color: #fff8d8;
    animation: glow1 2.4s ease-in-out infinite;
    margin-bottom: 14px;
  }
  .line2 {
    font-family: 'Courier New', 'Lucida Console', monospace;
    font-size: clamp(11px, 2vw, 18px);
    font-weight: bold;
    color: #e8c878;
    animation: glow2 3.8s ease-in-out infinite;
    letter-spacing: 0.3px;
  }
  @keyframes glow1 {
    0%, 100% {
      text-shadow:
        0 0 6px  #ffd86b,
        0 0 16px #ff9a3c,
        0 0 28px #ffb84c,
        0 2px 0 rgba(120,60,0,0.6);
    }
    50% {
      text-shadow:
        0 0 12px #ffffff,
        0 0 26px #ffd86b,
        0 0 46px #ff9a3c,
        0 0 70px #ff6a0c,
        0 2px 0 rgba(120,60,0,0.6);
    }
  }
  @keyframes glow2 {
    0%, 100% {
      text-shadow:
        0 0 4px  #c89030,
        0 0 10px #8a6020;
    }
    50% {
      text-shadow:
        0 0 8px  #ffd86b,
        0 0 18px #c89030,
        0 0 30px #8a6020;
    }
  }
</style>
</head>
<body>
<div class="stage">
  <canvas id="c" width="320" height="200"></canvas>
  <div class="msg" id="msg">
    <div class="line1">С Днём Рождения, Жасмин! ❤️</div>
    <div class="line2">Спасибо, что согреваешь своим светом 🌸</div>
  </div>
</div>
<script>
(() => {
  'use strict';

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const msgEl = document.getElementById('msg');
  const W = 320, H = 200;
  const BASE_GROUND_Y = 152;
  const FLOWER_X = 160;
  const MOON_X = 280, MOON_Y = 28;
  ctx.imageSmoothingEnabled = false;

  function getGroundY(x) {
    const dx = x - FLOWER_X;
    return BASE_GROUND_Y - 8 * Math.exp(-(dx * dx) / 420);
  }
  const HILL_PEAK_Y = getGroundY(FLOWER_X);

  // ---- Global state ----
  let t = 0;
  let dogState = 'run';
  let dogX = -20;
  let dogY = BASE_GROUND_Y - 8;
  let dogDir = 1;
  let dogTargetX = 130;
  let dogSpeed = 1.5;

  let sniffTimer = 0;
  let curlTimer = 0;
  let flowerGlow = 0;
  let flowerSwayX = 0;
  let weather = 'stars';
  let firstClickHintAlpha = 1;
  let hasInteracted = false;
  let hasCurled = false;
  let messageShown = false;

  // Play state
  let playPhase = 0;
  let playCycle = 0;
  let playTimer = 0;
  let playTargetX = 40;
  let bounceCount = 0;
  let bounceYOffset = 0;
  const MAX_PLAY_CYCLES = 2;
  const BOUNCE_DURATION = 30;
  const BOUNCE_PEAK = 10;
  const BOUNCES_PER_CYCLE = 3;
  const PAUSE_TURN_FRAMES = 55;
  const POST_CYCLE_FRAMES = 35;
  const RUNAWAY_SPEED = 1.0;
  const DASH_SPEED = 1.8;
  const NORMAL_SPEED = 1.5;

  // Return-to-flower after manual redirect
  let returnTimer = 0;
  const RETURN_DELAY = 180;

  // Click reactions
  let flowerWiggleTimer = 0;
  let dogReactionTimer = 0;
  let reactionYOffset = 0;

  // ---- Stars ----
  const stars = [];
  for (let i = 0; i < 60; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * 115,
      phase: Math.random() * Math.PI * 2,
      size: Math.random() < 0.75 ? 1 : 2,
      speed: 0.025 + Math.random() * 0.04,
    });
  }

  // ---- Clouds ----
  const clouds = [];
  for (let i = 0; i < 5; i++) {
    clouds.push({
      x: Math.random() * W,
      y: 18 + Math.random() * 55,
      r: 7 + Math.random() * 7,
      speed: 0.12 + Math.random() * 0.18,
    });
  }

  // ---- Raindrops ----
  const raindrops = [];
  for (let i = 0; i < 70; i++) {
    raindrops.push({
      x: Math.random() * W,
      y: Math.random() * H,
      speed: 1.8 + Math.random() * 1.6,
    });
  }

  // ---- Snowflakes ----
  const snowflakes = [];
  for (let i = 0; i < 95; i++) {
    snowflakes.push({
      x: Math.random() * W,
      y: Math.random() * H,
      speed: 0.22 + Math.random() * 0.48,
      drift: (Math.random() - 0.5) * 0.28,
      phase: Math.random() * Math.PI * 2,
      size: Math.random() < 0.62 ? 1 : 2,
    });
  }

  // ---- Distant hills ----
  const hillFar = [];
  for (let i = 0; i <= 12; i++) {
    hillFar.push({ x: (i / 12) * W, y: 118 + Math.sin(i * 0.6 + 1.2) * 5 });
  }
  const hillNear = [];
  for (let i = 0; i <= 16; i++) {
    hillNear.push({ x: (i / 16) * W, y: 124 + Math.sin(i * 0.85) * 5 + Math.cos(i * 1.4) * 3 });
  }

  // ---- Grass ----
  const GRASS_SHADES = ['#152d12', '#1c3a16', '#27521f', '#346b2b', '#458538'];
  const TIP_COLORS = ['#5fa040', '#7fc060', '#fff0a8', '#fffefa', '#cfe8b0'];
  const grass = [];
  for (let i = 0; i < 240; i++) {
    const len = 2 + Math.random() * 5.5;
    const shadeIdx = Math.min(
      GRASS_SHADES.length - 1,
      Math.floor((len / 7.5) * GRASS_SHADES.length + Math.random() * 1.3)
    );
    grass.push({
      x: Math.random() * W,
      len,
      phase: Math.random() * Math.PI * 2,
      swayAmp: 0.3 + Math.random() * 1.7,
      shade: GRASS_SHADES[shadeIdx],
      tip: Math.random() < 0.28 ? TIP_COLORS[Math.floor(Math.random() * TIP_COLORS.length)] : null,
      width: Math.random() < 0.08 ? 2 : 1,
      lean: (Math.random() - 0.5) * 1.2,
    });
  }

  // ---- Wildflowers ----
  const wildflowerPalettes = [
    { c: '#fff8a0', p: '#ffffff' },
    { c: '#ffd440', p: '#fff4a8' },
    { c: '#ff7090', p: '#ffc0d0' },
    { c: '#a890ff', p: '#d8caff' },
    { c: '#70b8ff', p: '#c0e0ff' },
  ];
  const wildflowers = [];
  for (let i = 0; i < 32; i++) {
    let x, attempts = 0;
    do { x = Math.random() * W; attempts++; } while (Math.abs(x - FLOWER_X) < 22 && attempts < 10);
    wildflowers.push({
      x: x | 0,
      palette: wildflowerPalettes[Math.floor(Math.random() * wildflowerPalettes.length)],
      pattern: Math.floor(Math.random() * 3),
      phase: Math.random() * Math.PI * 2,
      yOff: 2 + Math.floor(Math.random() * 3),
    });
  }

  // ---- Pebbles ----
  const pebbles = [];
  for (let i = 0; i < 14; i++) {
    let x;
    do { x = Math.random() * W; } while (Math.abs(x - FLOWER_X) < 18);
    pebbles.push({ x: x | 0, size: Math.random() < 0.5 ? 1 : 2 });
  }

  // ---- Foreground plants ----
  const FG_FLOWER_COLORS = ['#fffaaa', '#ffb4b4', '#cc99ff', '#ffd060', '#aaddff', '#ffccdd', '#aaffcc'];
  const FG_SHADES = ['#152d12', '#1c3a16', '#1a3015', '#27521f'];
  const fgPlants = [];
  for (let i = 0; i < 72; i++) {
    const x = (Math.random() * (W + 20)) - 10;
    const baseY = 166 + Math.random() * 31;
    const isFlower = Math.random() < 0.38;
    const len = isFlower ? (6 + Math.random() * 9) : (2 + Math.random() * 7);
    fgPlants.push({
      x,
      baseY,
      len,
      isFlower,
      shade: FG_SHADES[Math.floor(Math.random() * FG_SHADES.length)],
      flowerColor: isFlower ? FG_FLOWER_COLORS[Math.floor(Math.random() * FG_FLOWER_COLORS.length)] : null,
      phase: Math.random() * Math.PI * 2,
      swayAmp: 0.3 + Math.random() * 1.0,
    });
  }

  // ---- Stream ----
  const streamY = new Int16Array(W + 1);
  for (let x = 0; x <= W; x++) {
    streamY[x] = (182 + Math.sin(x * 0.030 + 0.5) * 5.5 + Math.sin(x * 0.065 + 1.8) * 3.0 + Math.sin(x * 0.13 + 0.9) * 1.4) | 0;
  }
  const STREAM_R = 6;

  // ---- Particles ----
  const sniffParticles = [];
  const sparkParticles = [];
  const heartParticles = [];
  const shootingStars = [];
  const butterflies = [];
  const BUTTERFLY_COLORS = ['#ff88cc', '#cc88ff', '#ffe066', '#88ddff', '#ffaa77'];

  // ---- Helpers ----
  function rect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x | 0, y | 0, w, h);
  }
  function ellipse(x, y, rx, ry, rot, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2);
    ctx.fill();
  }

  // ---- Sky ----
  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, BASE_GROUND_Y);
    g.addColorStop(0, '#07071a');
    g.addColorStop(0.55, '#12134a');
    g.addColorStop(1, '#1c1f5a');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, BASE_GROUND_Y);
  }

  function drawStars() {
    const v = weather === 'stars' ? 1 : weather === 'cloudy' ? 0.35 : weather === 'rain' ? 0.15 : 0;
    if (v <= 0.02) return;
    for (const s of stars) {
      const a = (0.35 + 0.65 * Math.abs(Math.sin(t * s.speed + s.phase))) * v;
      ctx.fillStyle = `rgba(255,255,230,${a})`;
      ctx.fillRect(s.x | 0, s.y | 0, s.size, s.size);
    }
  }

  function drawMoon() {
    const v = weather === 'stars' ? 1 : weather === 'cloudy' ? 0.65 : 0.45;
    if (v <= 0.02) return;
    const halo = ctx.createRadialGradient(MOON_X, MOON_Y, 0, MOON_X, MOON_Y, 18);
    halo.addColorStop(0, `rgba(255,245,200,${0.25 * v})`);
    halo.addColorStop(1, 'rgba(255,245,200,0)');
    ctx.fillStyle = halo;
    ctx.fillRect(MOON_X - 20, MOON_Y - 20, 40, 40);
    ctx.fillStyle = `rgba(244,233,193,${v})`;
    ctx.beginPath(); ctx.arc(MOON_X, MOON_Y, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgba(7,7,26,${v})`;
    ctx.beginPath(); ctx.arc(MOON_X - 3, MOON_Y - 2, 6, 0, Math.PI * 2); ctx.fill();
  }

  function drawClouds() {
    for (const cl of clouds) {
      cl.x -= cl.speed;
      if (cl.x < -40) cl.x = W + 25;
      ctx.fillStyle = weather === 'snow' ? 'rgba(205,215,230,0.82)' : 'rgba(170,175,195,0.55)';
      for (let i = -2; i <= 2; i++) {
        const rr = cl.r - Math.abs(i) * 1.5;
        if (rr <= 0) continue;
        ctx.beginPath();
        ctx.ellipse(cl.x + i * (cl.r * 0.7), cl.y + Math.abs(i) * 1.2, rr, rr * 0.62, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function drawRain() {
    ctx.strokeStyle = 'rgba(180,200,235,0.55)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (const r of raindrops) {
      r.x -= r.speed * 0.5;
      r.y += r.speed * 2.2;
      const gy = getGroundY(r.x);
      if (r.y > gy) { r.y = -2; r.x = Math.random() * W + 40; }
      if (r.x < -2) r.x = W + 2;
      ctx.moveTo(r.x, r.y);
      ctx.lineTo(r.x - 1.5, r.y + 4);
    }
    ctx.stroke();
  }

  function drawSnow() {
    for (const s of snowflakes) {
      s.x += s.drift + Math.sin(t * 0.015 + s.phase) * 0.4;
      s.y += s.speed;
      const gy = getGroundY(s.x);
      if (s.y > gy) { s.y = -2; s.x = Math.random() * W; }
      if (s.x < -2) s.x = W + 2;
      if (s.x > W + 2) s.x = -2;
      const alpha = (0.45 + (s.size > 1 ? 0.22 : 0) + Math.sin(t * 0.022 + s.phase) * 0.12).toFixed(2);
      ctx.fillStyle = `rgba(225,238,255,${alpha})`;
      ctx.fillRect(s.x | 0, s.y | 0, s.size, s.size);
    }
  }

  function drawHillsBg() {
    ctx.fillStyle = '#0e1834';
    ctx.beginPath();
    ctx.moveTo(0, BASE_GROUND_Y);
    for (const p of hillFar) ctx.lineTo(p.x, p.y);
    ctx.lineTo(W, BASE_GROUND_Y);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#091126';
    ctx.beginPath();
    ctx.moveTo(0, BASE_GROUND_Y);
    for (const p of hillNear) ctx.lineTo(p.x, p.y);
    ctx.lineTo(W, BASE_GROUND_Y);
    ctx.closePath(); ctx.fill();
  }

  function drawGround() {
    ctx.fillStyle = '#1f3a1a';
    ctx.beginPath();
    ctx.moveTo(0, H);
    ctx.lineTo(0, getGroundY(0));
    for (let x = 1; x <= W; x++) ctx.lineTo(x, getGroundY(x));
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#142510';
    ctx.fillRect(0, BASE_GROUND_Y + 18, W, H - BASE_GROUND_Y - 18);
    ctx.fillStyle = '#3a7a30';
    for (let x = 0; x < W; x++) {
      const gy = getGroundY(x) | 0;
      ctx.fillRect(x, gy, 1, 1);
    }
    ctx.fillStyle = 'rgba(120,180,90,0.35)';
    for (let x = 0; x < W; x += 2) {
      const gy = getGroundY(x) | 0;
      ctx.fillRect(x, gy + 1, 1, 1);
    }
  }

  function drawPebbles() {
    for (const p of pebbles) {
      const y = getGroundY(p.x) | 0;
      ctx.fillStyle = '#384a36';
      ctx.fillRect(p.x, y, p.size, 1);
      if (p.size > 1) {
        ctx.fillStyle = '#637856';
        ctx.fillRect(p.x, y, 1, 1);
      }
    }
  }

  function drawWildflowers(layer) {
    for (const wf of wildflowers) {
      const isFront = wf.pattern !== 1;
      if (layer === 0 && isFront) continue;
      if (layer === 1 && !isFront) continue;
      const baseY = getGroundY(wf.x);
      const sway = Math.sin(t * 0.04 + wf.phase) * 0.8;
      const x = (wf.x + sway) | 0;
      const y = (baseY - wf.yOff) | 0;
      if (wf.pattern === 0) {
        ctx.fillStyle = wf.palette.p;
        ctx.fillRect(x - 1, y, 1, 1);
        ctx.fillRect(x + 1, y, 1, 1);
        ctx.fillRect(x, y - 1, 1, 1);
        ctx.fillStyle = wf.palette.c;
        ctx.fillRect(x, y, 1, 1);
      } else if (wf.pattern === 1) {
        ctx.fillStyle = wf.palette.p;
        ctx.fillRect(x, y, 1, 1);
      } else {
        ctx.fillStyle = wf.palette.p;
        ctx.fillRect(x - 1, y, 1, 1);
        ctx.fillRect(x + 1, y, 1, 1);
        ctx.fillRect(x, y - 1, 1, 1);
        ctx.fillRect(x, y + 1, 1, 1);
        ctx.fillStyle = wf.palette.c;
        ctx.fillRect(x, y, 1, 1);
      }
    }
  }

  function drawGrass() {
    for (const b of grass) {
      const baseY = getGroundY(b.x);
      const sway = Math.sin(t * 0.05 + b.phase) * b.swayAmp + b.lean;
      ctx.fillStyle = b.shade;
      for (let dy = 0; dy < b.len; dy++) {
        const tt = dy / Math.max(1, b.len);
        const dx = sway * tt * 0.5;
        ctx.fillRect(Math.round(b.x + dx), Math.round(baseY - dy - 1), b.width, 1);
      }
      if (b.tip) {
        ctx.fillStyle = b.tip;
        const tipX = Math.round(b.x + sway * 0.5);
        ctx.fillRect(tipX, Math.round(baseY - b.len - 1), b.width, 1);
      }
    }
  }

  // ---- Flower ----
  function flowerReaction() {
    const dist = Math.abs(dogX - FLOWER_X);
    const prox = Math.max(0, 1 - dist / 90);
    const baseSway = Math.sin(t * 0.03) * (2 + prox * 1.8);
    const lean = (dogX > FLOWER_X ? 1 : -1) * prox * 3;
    let bounceShake = 0;
    if (dogState === 'play' && playPhase === 3) {
      bounceShake = Math.sin(t * 0.45) * prox * 2.2;
    } else if (dogState === 'play' && playPhase === 2) {
      bounceShake = Math.sin(t * 0.6) * prox * 1.2;
    }
    let wiggle = 0;
    if (flowerWiggleTimer > 0) {
      wiggle = Math.sin(flowerWiggleTimer * 0.55) * (flowerWiggleTimer / 50) * 5;
    }
    const wiggleBoost = flowerWiggleTimer > 0 ? flowerWiggleTimer / 50 : 0;
    return {
      sway: baseSway + lean + bounceShake + wiggle,
      prox,
      petalScale: 1
        + (dogState === 'play' && playPhase === 3 ? Math.abs(Math.sin(t * 0.45)) * prox * 0.25 : 0)
        + wiggleBoost * 0.25,
      centerBoost: prox * 0.3 + wiggleBoost * 0.4,
    };
  }

  function drawFlowerStem(x, baseY, glow, r) {
    flowerSwayX = r.sway;
    const topX = x + r.sway;
    const topY = baseY - 22;
    ctx.strokeStyle = '#2d5a26';
    ctx.lineWidth = 1.6;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x, baseY);
    ctx.quadraticCurveTo(x + r.sway * 0.5, baseY - 12, topX, topY);
    ctx.stroke();
    ctx.strokeStyle = '#458538';
    ctx.lineWidth = 0.6;
    ctx.beginPath();
    ctx.moveTo(x - 0.5, baseY - 1);
    ctx.quadraticCurveTo(x + r.sway * 0.5 - 0.5, baseY - 12, topX - 0.5, topY);
    ctx.stroke();
    // Leaves — placed high so both stay visible above curled dog
    ellipse(x - 3 + r.sway * 0.3, baseY - 12, 3.2, 1.5, -0.5, '#3a7a30');
    ellipse(x - 4 + r.sway * 0.3, baseY - 12, 1.6, 0.7, -0.5, '#5fa040');
    ellipse(x + 3 + r.sway * 0.4, baseY - 17, 3.2, 1.5, 0.5, '#3a7a30');
    ellipse(x + 4 + r.sway * 0.4, baseY - 17, 1.6, 0.7, 0.5, '#5fa040');
  }

  function drawFlowerHead(x, baseY, glow, r) {
    const topX = x + r.sway;
    const topY = baseY - 22;
    const pG = Math.round(252 - glow * 10);
    const pB = Math.round(238 - glow * 90);
    const petalColor = `rgb(255,${pG},${pB})`;
    const petalShadow = `rgb(${Math.round(220 - glow * 5)},${Math.round(220 - glow * 15)},${Math.round(210 - glow * 80)})`;
    const petalRX = 3 * r.petalScale;
    const petalRY = 1.6 * r.petalScale;
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      ctx.save();
      ctx.translate(topX + Math.cos(a) * 3, topY + Math.sin(a) * 3);
      ctx.rotate(a);
      ellipse(0.5, 0.5, petalRX, petalRY, 0, petalShadow);
      ellipse(0, 0, petalRX, petalRY, 0, petalColor);
      ctx.restore();
    }
    const centerColor = `rgb(255, ${Math.round(218 + glow * 32 + r.centerBoost * 20)}, ${Math.round(60 + glow * 40)})`;
    ellipse(topX, topY, 1.9, 1.9, 0, centerColor);
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillRect(Math.round(topX - 1), Math.round(topY - 1), 1, 1);
  }

  function drawFlowerHalo(x, baseY, glow) {
    const wiggleHalo = flowerWiggleTimer > 0 ? (flowerWiggleTimer / 50) * 0.6 : 0;
    const effective = Math.max(glow, wiggleHalo);
    if (effective < 0.02) return;
    const topX = x + flowerSwayX;
    const topY = baseY - 22;
    const haloR = 14 + effective * 26;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const grad = ctx.createRadialGradient(topX, topY, 0, topX, topY, haloR);
    grad.addColorStop(0,   `rgba(255,225,130,${0.48 * effective})`);
    grad.addColorStop(0.45,`rgba(255,180,80,${0.28 * effective})`);
    grad.addColorStop(1,   'rgba(255,180,80,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(topX - haloR, topY - haloR, haloR * 2, haloR * 2);
    ctx.restore();
  }

  // ---- Dog ----
  const DOG = {
    body: '#c8832a',
    dark: '#8b5a1a',
    light: '#e8a040',
    eye:  '#3d1a00',
  };

  function withFlip(x, dir, fn) {
    if (dir < 0) {
      ctx.save();
      ctx.translate(x * 2, 0);
      ctx.scale(-1, 1);
      fn();
      ctx.restore();
    } else {
      fn();
    }
  }

  function drawDogRun(x, y, dir, jumping) {
    withFlip(x, dir, () => {
      const swingFreq = jumping ? 0.0 : 0.5;
      const swing  = Math.sin(t * swingFreq) * (jumping ? 0.6 : 2);
      const swing2 = Math.sin(t * swingFreq + Math.PI) * (jumping ? 0.6 : 2);
      const tailWag = Math.sin(t * 0.4) * 2;
      ellipse(x - 8, y - 4 + tailWag * 0.5, 3, 1.6, -0.4, DOG.body);
      rect(x - 5, y + 2, 2, 4 + swing,  DOG.dark);
      rect(x - 2, y + 2, 2, 4 + swing2, DOG.dark);
      ellipse(x, y, 7, 4, 0, DOG.body);
      ellipse(x, y + 1, 5, 2, 0, DOG.light);
      rect(x + 3, y + 2, 2, 4 + swing2, DOG.dark);
      rect(x + 5, y + 2, 2, 4 + swing,  DOG.dark);
      ellipse(x + 7, y - 3, 4, 3.6, 0, DOG.body);
      ellipse(x + 10, y - 2, 2, 1.5, 0, DOG.light);
      ellipse(x + 5, y - 6, 2, 2.5, -0.3, DOG.dark);
      rect(x + 8, y - 4, 1, 1, DOG.eye);
      rect(x + 11, y - 2, 1, 1, DOG.eye);
    });
  }

  function drawDogSniff(x, y, dir) {
    withFlip(x, dir, () => {
      const tailWag = Math.sin(t * 0.7) * 3;
      ellipse(x - 6 + tailWag * 0.4, y - 5 + tailWag * 0.2, 2, 3, 0.4, DOG.body);
      rect(x - 5, y + 2, 2, 4, DOG.dark);
      rect(x - 2, y + 2, 2, 4, DOG.dark);
      ellipse(x + 1, y, 7, 4, -0.15, DOG.body);
      ellipse(x + 1, y + 1, 5, 2, -0.15, DOG.light);
      rect(x + 4, y + 2, 2, 4, DOG.dark);
      rect(x + 6, y + 2, 2, 4, DOG.dark);
      ellipse(x + 9, y - 1, 4, 3.5, 0.35, DOG.body);
      ellipse(x + 12, y + 1, 2, 1.5, 0.3, DOG.light);
      ellipse(x + 7, y - 4, 2, 2.5, 0.1, DOG.dark);
      rect(x + 10, y - 1, 1, 1, DOG.eye);
      rect(x + 13, y + 1, 1, 1, DOG.eye);
    });
  }

  function drawDogCurl(cx, cy) {
    const breath = Math.sin(t * 0.05) * 0.4;
    // Haunches / rump — outer curve of the curl
    ellipse(cx - 3, cy + 1, 9, 6, 0.12, DOG.body);
    // Shoulder / upper back — overlapping, shifted
    ellipse(cx + 4, cy - 1, 6, 5, 0.28, DOG.body);
    // Belly — lighter inner side of the curl
    ellipse(cx + 1, cy + 2.5, 5, 3, 0.08, DOG.light);
    // Dark back ridge along the top arc
    ellipse(cx - 2, cy - 3.5, 5.5, 1.8, 0.15, DOG.dark);
    // Ground shadow
    ellipse(cx - 1, cy + 6.5, 7.5, 1.2, 0, DOG.dark);
    // Tail curling around the left side
    ellipse(cx - 10, cy + 2.5, 2.8, 1.9, -0.45, DOG.body);
    ellipse(cx - 12, cy + 0.5, 2.1, 1.6, -1.0, DOG.body);
    ellipse(cx - 12, cy + 0.5, 1.0, 0.8, -1.0, DOG.light);
    // Front paws tucked under, peeking out
    ellipse(cx + 3.5, cy + 6, 2.8, 1.2, 0.22, DOG.dark);
    ellipse(cx - 1, cy + 6.5, 2.3, 1.1, -0.15, DOG.dark);
    rect(cx + 2, cy + 7, 1, 1, DOG.body);
    rect(cx + 4, cy + 7, 1, 1, DOG.body);
    // Fur tufts at flower stem
    rect(cx - 4, cy - 6, 1, 1, DOG.dark);
    rect(cx - 1, cy - 7, 1, 1, DOG.dark);
    rect(cx + 2, cy - 7, 1, 1, DOG.dark);
    rect(cx + 5, cy - 5, 1, 1, DOG.dark);
    // Head resting on top of body
    const hx = cx + 11;
    const hy = cy - 0.5 + breath;
    ellipse(hx, hy, 3.8, 3.2, 0.3, DOG.body);
    // Ear — floppy and relaxed
    const earTwitch = dogReactionTimer > 0 ? Math.sin(dogReactionTimer * 0.5) * 0.4 : 0;
    ellipse(hx - 1, hy - 2.5, 2, 2.5, -0.25 + earTwitch, DOG.dark);
    // Snout resting down
    ellipse(hx + 2.5, hy + 1.5, 2, 1.4, 0.32, DOG.light);
    // Eye — closed, briefly peeks on reaction
    const peek = dogReactionTimer > 8 && dogReactionTimer < 22;
    if (peek) {
      rect(hx + 1, hy - 1, 1, 1, DOG.eye);
    } else {
      ctx.strokeStyle = DOG.eye;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(hx + 1, hy - 0.5, 1.1, 0, Math.PI);
      ctx.stroke();
    }
    rect(hx + 3, hy + 1, 1, 1, DOG.eye);
    // Z letters
    const phA = (Math.sin(t * 0.06) + 1) * 0.5;
    const phB = (Math.sin(t * 0.06 + Math.PI) + 1) * 0.5;
    ctx.font = 'bold 7px "Courier New", monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = `rgba(255,255,255,${0.3 + 0.55 * phA})`;
    ctx.fillText('z', hx + 5, hy - 6 + Math.sin(t * 0.04) * 2);
    ctx.fillStyle = `rgba(255,255,255,${0.3 + 0.55 * phB})`;
    ctx.fillText('Z', hx + 9, hy - 13 + Math.sin(t * 0.04 + 1) * 2);
  }

  // ---- Particles ----
  function drawSniffParticles() {
    for (let i = sniffParticles.length - 1; i >= 0; i--) {
      const p = sniffParticles[i];
      p.life--;
      p.y -= 0.32;
      p.x += p.vx;
      if (p.life <= 0) { sniffParticles.splice(i, 1); continue; }
      ctx.fillStyle = `rgba(220,220,255,${Math.min(1, p.life / 25)})`;
      ctx.fillRect(p.x | 0, p.y | 0, 1, 1);
    }
  }

  function drawSparkParticles() {
    for (let i = sparkParticles.length - 1; i >= 0; i--) {
      const p = sparkParticles[i];
      p.life--;
      if (p.vy !== undefined) {
        p.y += p.vy;
        if (p.gravity) p.vy += 0.05;
      } else {
        p.y -= 0.55;
      }
      p.x += p.vx;
      if (p.life <= 0) { sparkParticles.splice(i, 1); continue; }
      const a = Math.min(1, p.life / 50);
      ctx.fillStyle = `rgba(255,220,120,${a})`;
      ctx.fillRect(p.x | 0, p.y | 0, 1, 1);
      ctx.fillStyle = `rgba(255,180,80,${a * 0.35})`;
      ctx.fillRect((p.x | 0) - 1, (p.y | 0) + 1, 1, 1);
    }
  }

  function drawHeart(x, y, alpha) {
    ctx.fillStyle = `rgba(255,120,150,${alpha})`;
    ctx.fillRect(x + 1, y, 2, 1);
    ctx.fillRect(x + 4, y, 2, 1);
    ctx.fillRect(x, y + 1, 6, 1);
    ctx.fillRect(x + 1, y + 2, 4, 1);
    ctx.fillRect(x + 2, y + 3, 2, 1);
  }
  function drawHeartParticles() {
    for (let i = heartParticles.length - 1; i >= 0; i--) {
      const p = heartParticles[i];
      p.life--;
      p.y -= 0.22;
      if (p.life <= 0) { heartParticles.splice(i, 1); continue; }
      const a = Math.min(1, p.life / 90);
      drawHeart(p.x | 0, p.y | 0, a);
    }
  }

  function drawButterfly(bx, by, color, wf, alpha) {
    const w = Math.round(1 + wf * 3);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    // Upper wings
    ctx.fillRect((bx - w - 1) | 0, (by - 2) | 0, w, 2);
    ctx.fillRect((bx + 1) | 0, (by - 2) | 0, w, 2);
    // Lower wings (smaller)
    ctx.fillRect((bx - w) | 0, by | 0, Math.max(1, w - 1), 1);
    ctx.fillRect((bx + 1) | 0, by | 0, Math.max(1, w - 1), 1);
    // Wing highlight
    if (w >= 2) {
      ctx.fillStyle = 'rgba(255,255,255,0.38)';
      ctx.fillRect((bx - 2) | 0, (by - 2) | 0, 1, 1);
      ctx.fillRect((bx + 1) | 0, (by - 2) | 0, 1, 1);
    }
    // Body
    ctx.fillStyle = '#1a0a05';
    ctx.fillRect(bx | 0, (by - 3) | 0, 1, 5);
    // Antennae
    ctx.fillRect((bx - 1) | 0, (by - 4) | 0, 1, 1);
    ctx.fillRect((bx + 1) | 0, (by - 4) | 0, 1, 1);
    ctx.restore();
  }

  function spawnButterflies() {
    for (let i = 0; i < 5; i++) {
      const delay = i * 85 + Math.floor(Math.random() * 30);
      const maxLife = delay + 280 + Math.floor(Math.random() * 160);
      butterflies.push({
        x: FLOWER_X + (Math.random() - 0.5) * 28,
        y: HILL_PEAK_Y - 14 - Math.random() * 22,
        vx: (Math.random() - 0.5) * 0.12,
        vy: -0.01 - Math.random() * 0.06,
        color: BUTTERFLY_COLORS[Math.floor(Math.random() * BUTTERFLY_COLORS.length)],
        phase: Math.random() * Math.PI * 2,
        life: maxLife,
        age: 0,
        delay,
        wingPhase: Math.random() * Math.PI * 2,
      });
    }
  }

  function updateAndDrawButterflies() {
    for (let i = butterflies.length - 1; i >= 0; i--) {
      const b = butterflies[i];
      b.life--;
      if (b.life <= 0) { butterflies.splice(i, 1); continue; }
      if (b.delay > 0) { b.delay--; continue; }
      b.age++;
      const tx = FLOWER_X + Math.sin(b.phase + t * 0.007) * 48;
      const ty = HILL_PEAK_Y - 32 + Math.cos(b.phase * 1.3 + t * 0.005) * 14;
      b.vx += (tx - b.x) * 0.0015 + (Math.random() - 0.5) * 0.018;
      b.vy += (ty - b.y) * 0.0015 + (Math.random() - 0.5) * 0.018;
      const spd = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
      if (spd > 0.25) { b.vx *= 0.25 / spd; b.vy *= 0.25 / spd; }
      b.x += b.vx;
      b.y += b.vy;
      b.wingPhase += 0.28 + Math.random() * 0.04;
      const fadeIn = Math.min(1, b.age / 55);
      const fadeOut = Math.min(1, b.life / 55);
      const alpha = Math.min(fadeIn, fadeOut);
      const wf = (Math.sin(b.wingPhase) + 1) / 2;
      drawButterfly(b.x, b.y, b.color, wf, alpha);
    }
  }

  function drawStream() {
    for (let x = 0; x < W; x++) {
      const cy = streamY[x];
      // Depth gradient — darkest at edges, lighter toward centre
      ctx.fillStyle = '#0b1c2c';
      ctx.fillRect(x, cy - STREAM_R,     1, STREAM_R * 2 + 1);
      ctx.fillStyle = '#0f2438';
      ctx.fillRect(x, cy - STREAM_R + 2, 1, (STREAM_R - 2) * 2 + 1);
      ctx.fillStyle = '#163044';
      ctx.fillRect(x, cy - STREAM_R + 4, 1, (STREAM_R - 4) * 2 + 1);
      ctx.fillStyle = '#1a3a54';
      ctx.fillRect(x, cy - 1,            1, 3);
      // Flowing highlight wave 1 — spans inner band
      const p1 = ((x * 3 + t * 2) | 0) % 22;
      if (p1 < 2) {
        ctx.fillStyle = 'rgba(75,185,235,0.42)';
        ctx.fillRect(x, cy - 2, 1, 5);
      }
      // Flowing highlight wave 2 — slower, offset
      const p2 = ((x * 5 + t + 11) | 0) % 30;
      if (p2 < 2) {
        ctx.fillStyle = 'rgba(155,220,255,0.26)';
        ctx.fillRect(x, cy + 1, 1, 3);
      }
      // Occasional sparkle
      const ps = ((x * 11 + t * 3) | 0) % 58;
      if (ps === 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.38)';
        ctx.fillRect(x, cy - 3, 1, 1);
      }
      // Top bank — two-tone
      ctx.fillStyle = '#243e1c';
      ctx.fillRect(x, cy - STREAM_R - 2, 1, 2);
      // Bottom bank
      ctx.fillStyle = '#1a3014';
      ctx.fillRect(x, cy + STREAM_R + 1, 1, 2);
    }
  }

  function drawForegroundPlants() {
    for (const p of fgPlants) {
      const sway = Math.sin(t * 0.038 + p.phase) * p.swayAmp;
      ctx.fillStyle = p.shade;
      for (let dy = 0; dy < p.len; dy++) {
        const tt = dy / Math.max(1, p.len - 1);
        const dx = sway * tt * 0.55;
        ctx.fillRect(Math.round(p.x + dx), Math.round(p.baseY - dy), 1, 1);
      }
      if (p.isFlower) {
        const tipX = Math.round(p.x + sway * 0.55);
        const tipY = Math.round(p.baseY - p.len);
        ctx.fillStyle = p.flowerColor;
        ctx.fillRect(tipX - 1, tipY, 1, 1);
        ctx.fillRect(tipX + 1, tipY, 1, 1);
        ctx.fillRect(tipX, tipY - 1, 1, 1);
        ctx.fillStyle = 'rgba(255,255,255,0.45)';
        ctx.fillRect(tipX, tipY, 1, 1);
      }
    }
  }

  function drawShootingStars() {
    for (let i = shootingStars.length - 1; i >= 0; i--) {
      const s = shootingStars[i];
      s.trail.push({ x: s.x, y: s.y });
      if (s.trail.length > 16) s.trail.shift();
      s.x += s.vx;
      s.y += s.vy;
      s.life--;
      if (s.life <= 0 || s.x < -10 || s.y > 130) {
        shootingStars.splice(i, 1);
        continue;
      }
      for (let j = 0; j < s.trail.length; j++) {
        const p = s.trail[j];
        const a = (j / s.trail.length) * Math.min(1, s.life / 40);
        ctx.fillStyle = `rgba(255,250,210,${a * 0.7})`;
        ctx.fillRect(p.x | 0, p.y | 0, 1, 1);
      }
      const aHead = Math.min(1, s.life / 40);
      ctx.fillStyle = `rgba(255,255,255,${aHead})`;
      ctx.fillRect(s.x | 0, s.y | 0, 2, 2);
      ctx.fillStyle = `rgba(255,250,180,${aHead * 0.5})`;
      ctx.fillRect((s.x | 0) - 1, s.y | 0, 1, 1);
      ctx.fillRect((s.x | 0) + 2, s.y | 0, 1, 1);
      ctx.fillRect(s.x | 0, (s.y | 0) - 1, 2, 1);
      ctx.fillRect(s.x | 0, (s.y | 0) + 2, 2, 1);
    }
  }

  function spawnShootingStar() {
    shootingStars.push({
      x: MOON_X, y: MOON_Y,
      vx: -2.5 - Math.random() * 2,
      vy: 1.5 + Math.random() * 1.2,
      life: 70,
      trail: [],
    });
  }

  function drawHints() {
    if (firstClickHintAlpha <= 0.01) return;
    ctx.font = 'bold 6px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = `rgba(255,255,255,${firstClickHintAlpha * 0.75})`;
    ctx.fillText('↑ клик — погода', W / 2, 11);
    ctx.fillText('↓ клик — пёс бежит', W / 2, H - 5);
    ctx.textAlign = 'left';
  }

  // ---- State machine helpers ----
  function transitionToCurl() {
    dogState = 'curl';
    curlTimer = 0;
    hasCurled = true;
    spawnButterflies();
  }
  function startPlayCycle() {
    dogState = 'play';
    playPhase = 0;
    playTimer = 0;
    bounceCount = 0;
    playTargetX = dogX < FLOWER_X ? 35 + Math.random() * 15 : 270 + Math.random() * 15;
    dogSpeed = RUNAWAY_SPEED;
  }

  // ---- Click reactions ----
  function handleFlowerClick() {
    flowerWiggleTimer = 50;
    for (let i = 0; i < 14; i++) {
      const ang = (i / 14) * Math.PI * 2;
      sparkParticles.push({
        x: FLOWER_X + flowerSwayX + (Math.random() - 0.5) * 3,
        y: HILL_PEAK_Y - 22 + (Math.random() - 0.5) * 3,
        vx: Math.cos(ang) * (0.7 + Math.random() * 0.8),
        vy: Math.sin(ang) * (0.7 + Math.random() * 0.8),
        life: 30 + Math.random() * 20,
        gravity: true,
      });
    }
    heartParticles.push({
      x: FLOWER_X - 3,
      y: HILL_PEAK_Y - 26,
      life: 80,
    });
  }

  function handleDogClick() {
    dogReactionTimer = 30;
    if (hasCurled) {
      for (let i = 0; i < 3; i++) {
        heartParticles.push({
          x: FLOWER_X - 4 + i * 4 + (Math.random() - 0.5) * 3,
          y: HILL_PEAK_Y - 4 - i * 2,
          life: 70,
        });
      }
    } else {
      for (let i = 0; i < 4; i++) {
        heartParticles.push({
          x: dogX - 4 + i * 3,
          y: dogY - 6 - Math.random() * 4,
          life: 70 + Math.random() * 20,
        });
      }
    }
  }

  function handleMoonClick() {
    spawnShootingStar();
  }

  // ---- Update ----
  function update() {
    t++;
    if (hasInteracted) firstClickHintAlpha = Math.max(0, firstClickHintAlpha - 0.025);
    else if (t > 180) firstClickHintAlpha = Math.max(0, firstClickHintAlpha - 0.005);

    if (flowerWiggleTimer > 0) flowerWiggleTimer--;
    if (dogReactionTimer > 0) {
      dogReactionTimer--;
      const tt = 1 - dogReactionTimer / 30;
      reactionYOffset = -Math.sin(tt * Math.PI) * 5;
    } else {
      reactionYOffset = 0;
    }

    if (dogState !== 'curl') {
      const bounce = (dogState === 'play' && playPhase === 3) ? bounceYOffset : 0;
      dogY = getGroundY(dogX) - 8 + bounce + reactionYOffset;
    }

    if (dogState === 'run') {
      const dx = dogTargetX - dogX;
      if (Math.abs(dx) < 2) {
        dogState = 'sniff';
        sniffTimer = 130;
      } else {
        dogDir = dx > 0 ? 1 : -1;
        dogX += dogDir * dogSpeed;
      }
    } else if (dogState === 'sniff') {
      if (sniffTimer > 0) sniffTimer--;
      if (sniffTimer > 20 && t % 4 === 0) {
        const nx = dogDir > 0 ? dogX + 13 : dogX - 13;
        sniffParticles.push({
          x: nx + (Math.random() - 0.5) * 2,
          y: dogY + 2,
          vx: (Math.random() - 0.5) * 0.6,
          life: 22 + Math.random() * 15,
        });
      }
      if (sniffTimer === 0) {
        const nearFlower = Math.abs(dogX - FLOWER_X) < 35;
        if (nearFlower) {
          returnTimer = 0;
          if (playCycle < MAX_PLAY_CYCLES) {
            startPlayCycle();
          } else {
            transitionToCurl();
          }
        } else {
          // After manual sniff, wait 3 seconds, then walk back to flower
          if (returnTimer <= 0) returnTimer = RETURN_DELAY;
          returnTimer--;
          if (returnTimer === 0) {
            dogState = 'run';
            dogTargetX = dogX < FLOWER_X ? 130 : 190;
            dogSpeed = NORMAL_SPEED;
          }
        }
      }
    } else if (dogState === 'play') {
      if (playPhase === 0) {
        const dx = playTargetX - dogX;
        if (Math.abs(dx) < 2) {
          playPhase = 1;
          playTimer = 0;
        } else {
          dogDir = dx > 0 ? 1 : -1;
          dogX += dogDir * dogSpeed;
        }
      } else if (playPhase === 1) {
        playTimer++;
        dogDir = dogX < FLOWER_X ? 1 : -1;
        if (playTimer > PAUSE_TURN_FRAMES) {
          playPhase = 2;
          playTimer = 0;
          playTargetX = dogX < FLOWER_X ? 142 : 178;
          dogSpeed = DASH_SPEED;
        }
      } else if (playPhase === 2) {
        const dx = playTargetX - dogX;
        if (Math.abs(dx) < 3) {
          playPhase = 3;
          playTimer = 0;
          bounceCount = 0;
          dogSpeed = NORMAL_SPEED;
        } else {
          dogDir = dx > 0 ? 1 : -1;
          dogX += dogDir * dogSpeed;
          if (t % 3 === 0) {
            sniffParticles.push({
              x: dogX - dogDir * 8,
              y: getGroundY(dogX) - 1,
              vx: -dogDir * 0.3 + (Math.random() - 0.5) * 0.2,
              life: 15,
            });
          }
          if (Math.abs(dogX - FLOWER_X) < 25 && t % 5 === 0 && flowerGlow < 0.1) {
            sparkParticles.push({
              x: FLOWER_X + (Math.random() - 0.5) * 4,
              y: HILL_PEAK_Y - 22 + (Math.random() - 0.5) * 4,
              vx: (Math.random() - 0.5) * 0.5,
              life: 20 + Math.random() * 15,
            });
          }
        }
      } else if (playPhase === 3) {
        playTimer++;
        const bt = playTimer / BOUNCE_DURATION;
        bounceYOffset = -Math.sin(Math.min(1, bt) * Math.PI) * BOUNCE_PEAK;
        if (Math.abs(bt - 1) < 0.06 && t % 2 === 0) {
          sniffParticles.push({
            x: dogX + (Math.random() - 0.5) * 6,
            y: getGroundY(dogX),
            vx: (Math.random() - 0.5) * 0.4,
            life: 12,
          });
        }
        if (bt >= 1) {
          bounceCount++;
          playTimer = 0;
          if (bounceCount >= BOUNCES_PER_CYCLE) {
            bounceCount = 0;
            bounceYOffset = 0;
            playPhase = 4;
            playTimer = 0;
          }
        }
      } else if (playPhase === 4) {
        playTimer++;
        dogDir = dogX < FLOWER_X ? 1 : -1;
        if (playTimer >= POST_CYCLE_FRAMES) {
          playCycle++;
          if (playCycle >= MAX_PLAY_CYCLES) {
            transitionToCurl();
          } else {
            playPhase = 0;
            playTimer = 0;
            playTargetX = dogX < FLOWER_X ? 270 + Math.random() * 15 : 35 + Math.random() * 15;
            dogSpeed = RUNAWAY_SPEED;
          }
        }
      }
    } else if (dogState === 'curl') {
      curlTimer++;
      flowerGlow = Math.min(1, flowerGlow + 1 / 520);
      if (t % 140 === 0 && butterflies.length < 9) {
        for (let i = 0; i < 2; i++) {
          const delay = i * 60;
          const maxLife = delay + 240 + Math.floor(Math.random() * 130);
          butterflies.push({
            x: FLOWER_X + (Math.random() - 0.5) * 36,
            y: HILL_PEAK_Y - 18 - Math.random() * 18,
            vx: (Math.random() - 0.5) * 0.11,
            vy: -0.01 - Math.random() * 0.06,
            color: BUTTERFLY_COLORS[Math.floor(Math.random() * BUTTERFLY_COLORS.length)],
            phase: Math.random() * Math.PI * 2,
            life: maxLife,
            age: 0,
            delay,
            wingPhase: Math.random() * Math.PI * 2,
          });
        }
      }
      if (flowerGlow > 0.25 && t % 6 === 0) {
        sparkParticles.push({
          x: FLOWER_X + Math.sin(t * 0.03) * 3 + (Math.random() - 0.5) * 6,
          y: HILL_PEAK_Y - 22 + (Math.random() - 0.5) * 4,
          vx: (Math.random() - 0.5) * 0.4,
          life: 40 + Math.random() * 40,
        });
      }
      if (flowerGlow > 0.85 && t % 55 === 0) {
        heartParticles.push({
          x: FLOWER_X - 6 + Math.random() * 12,
          y: HILL_PEAK_Y - 18,
          life: 110,
        });
      }
      if (flowerGlow > 0.92 && !messageShown) {
        messageShown = true;
        msgEl.classList.add('show');
      }
    }
  }

  // ---- Render ----
  function render() {
    drawSky();
    drawStars();
    if (weather === 'cloudy' || weather === 'rain' || weather === 'snow') drawClouds();
    drawMoon();
    drawShootingStars();
    drawHillsBg();
    if (weather === 'rain') drawRain();

    drawGround();
    drawStream();
    drawPebbles();
    drawWildflowers(0);
    drawGrass();
    drawWildflowers(1);

    const reaction = flowerReaction();
    drawFlowerStem(FLOWER_X, HILL_PEAK_Y, flowerGlow, reaction);

    if (dogState === 'run') {
      drawDogRun(dogX, dogY, dogDir, false);
    } else if (dogState === 'sniff') {
      drawDogSniff(dogX, dogY, dogDir);
    } else if (dogState === 'play') {
      const jumping = (playPhase === 3 && bounceYOffset < -2);
      if (playPhase === 1 || playPhase === 4) {
        drawDogSniff(dogX, dogY, dogDir);
      } else {
        drawDogRun(dogX, dogY, dogDir, jumping);
      }
    } else if (dogState === 'curl') {
      drawDogCurl(FLOWER_X, HILL_PEAK_Y - 2);
    }

    drawSniffParticles();
    drawFlowerHead(FLOWER_X, HILL_PEAK_Y, flowerGlow, reaction);
    drawSparkParticles();
    drawHeartParticles();
    drawFlowerHalo(FLOWER_X, HILL_PEAK_Y, flowerGlow);
    drawForegroundPlants();
    if (weather === 'snow') drawSnow();
    updateAndDrawButterflies();

    drawHints();
  }

  function loop() {
    update();
    render();
    requestAnimationFrame(loop);
  }

  // ---- Interaction ----
  function handleClick(e) {
    const rect = canvas.getBoundingClientRect();
    const cx = (e.clientX - rect.left) * (W / rect.width);
    const cy = (e.clientY - rect.top)  * (H / rect.height);
    hasInteracted = true;

    // 1) Flower hit (head + stem)
    const fhx = FLOWER_X + flowerSwayX;
    const fhy = HILL_PEAK_Y - 22;
    if (Math.abs(cx - fhx) < 10 && Math.abs(cy - fhy) < 11) {
      handleFlowerClick();
      return;
    }
    if (Math.abs(cx - FLOWER_X) < 6 && cy >= fhy && cy <= HILL_PEAK_Y - 4) {
      handleFlowerClick();
      return;
    }

    // 2) Dog hit
    if (!hasCurled) {
      if (Math.abs(cx - dogX) < 12 && Math.abs(cy - dogY) < 12) {
        handleDogClick();
        return;
      }
    } else {
      if (Math.abs(cx - FLOWER_X) < 17 && cy > HILL_PEAK_Y - 8 && cy < HILL_PEAK_Y + 10) {
        handleDogClick();
        return;
      }
    }

    // 3) Moon hit (only if visible)
    if ((weather === 'stars' || weather === 'cloudy')
        && Math.abs(cx - MOON_X) < 13 && Math.abs(cy - MOON_Y) < 13) {
      handleMoonClick();
      return;
    }

    // 4) Sky vs ground
    if (cy < 128) {
      weather = weather === 'stars' ? 'cloudy'
              : weather === 'cloudy' ? 'rain'
              : weather === 'rain' ? 'snow'
              : 'stars';
    } else {
      if (hasCurled) return;
      returnTimer = 0;
      dogState = 'run';
      dogTargetX = Math.max(10, Math.min(W - 14, cx));
      dogSpeed = NORMAL_SPEED;
    }
  }

  canvas.addEventListener('click', handleClick);

  loop();
})();
</script>
</body>
</html>
